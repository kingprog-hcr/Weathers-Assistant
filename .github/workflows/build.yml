name: Build WeatherProgramm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller project.spec --clean

      - name: Rename executable (Linux/Mac)
        if: runner.os != 'Windows'
        run: mv dist/WeatherProgramm dist/WeatherProgramm-${{ runner.os }}

      - name: Copy license next to executable (Linux/Mac)
        if: runner.os != 'Windows'
        run: cp LICENSE dist/WeatherProgramm-${{ runner.os }}-LICENSE.txt

      - name: Copy Windows license files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/WeatherProgramm-Windows-LICENSE.txt

      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH","Machine") + ";" + $env:PATH
          Write-Host "Contenu de dist/:"
          Get-ChildItem dist\
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Copy license next to Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item LICENSE Output/WeatherProgramm-Setup-Windows-LICENSE.txt

      - name: Upload artifact (Linux/Mac)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: WeatherProgramm-${{ runner.os }}
          path: |
            dist/WeatherProgramm-${{ runner.os }}
            dist/WeatherProgramm-${{ runner.os }}-LICENSE.txt

      - name: Upload artifact (Windows exe)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: WeatherProgramm-Windows
          path: |
            dist/WeatherProgramm.exe
            dist/WeatherProgramm-Windows-LICENSE.txt

      - name: Upload artifact (Windows installer)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: WeatherProgramm-Setup-Windows
          path: |
            Output/WeatherProgramm-Setup.exe
            Output/WeatherProgramm-Setup-Windows-LICENSE.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WeatherProgramm-Linux/WeatherProgramm-Linux
            WeatherProgramm-Linux/WeatherProgramm-Linux-LICENSE.txt
            WeatherProgramm-Windows/WeatherProgramm.exe
            WeatherProgramm-Windows/WeatherProgramm-Windows-LICENSE.txt
            WeatherProgramm-Setup-Windows/WeatherProgramm-Setup.exe
            WeatherProgramm-Setup-Windows/WeatherProgramm-Setup-Windows-LICENSE.txt
            WeatherProgramm-macOS/WeatherProgramm-macOS
            WeatherProgramm-macOS/WeatherProgramm-macOS-LICENSE.txt
          body: |
            ## WeatherProgramm ${{ github.ref_name }}

            | Système | Fichier | Description |
            |---|---|---|
            | Windows | WeatherProgramm-Setup.exe | **Installeur recommandé** |
            | Windows | WeatherProgramm.exe | Exécutable portable |
            | Linux | WeatherProgramm-Linux | Exécutable Linux |
            | macOS | WeatherProgramm-macOS | Exécutable macOS |

            Weather and AI requests use the WeatherProgramm backend at
            https://weathers-assistant.onrender.com by default. Provider keys
            must never be added to the desktop app.

            The map fetches visible tiles directly from OpenStreetMap. No map API
            key is required; attribution and tile usage policies apply.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
